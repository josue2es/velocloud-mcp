[project]
name = "velocloud-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2",
    "httpx>=0.27",
    "python-dotenv>=1",
]

[project.scripts]
velocloud-mcp = "velocloud_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velocloud_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
